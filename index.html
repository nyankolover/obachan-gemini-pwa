<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Gemini</title>

  <!-- PWA & iOS 設定 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gemini">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- サイドバー（パソコンでは常時表示、スマホでは ☰ で開く） -->
    <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <button id="sidebar-close-btn" class="icon-btn" aria-label="メニューを閉じる">☰</button>
        <button id="new-chat-btn" class="new-chat-btn">＋ 新しいチャット</button>
      </div>
      <div class="sidebar-section-title">最近</div>
      <nav id="chat-list" class="chat-list" aria-label="チャット履歴"></nav>
      <div class="sidebar-bottom">
        <a id="call-btn-side" class="side-link call-link" href="#" hidden>📞 洸晟に電話</a>
        <button id="settings-btn" class="side-link">⚙️ 設定</button>
      </div>
    </aside>

    <!-- メイン -->
    <div class="main">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn" aria-label="メニュー">☰</button>
        <div class="brand">
          <span class="brand-title">Gemini</span>
        </div>
        <a id="call-btn" class="call-btn" href="#" hidden>📞<span class="call-label">洸晟に電話</span></a>
      </header>

      <main id="chat-messages" class="chat">
        <!-- 初期画面（Gemini風の挨拶と提案カード） -->
        <section id="welcome" class="welcome">
          <h1 class="welcome-title">こんにちは</h1>
          <p class="welcome-sub">今日は何をお手伝いしましょうか？</p>
          <div class="suggestions">
            <button class="suggestion-card" data-mode="ad_check" data-photo="1"
              data-prompt="この広告はあやしくないですか？押しても大丈夫ですか？">
              <span class="suggestion-icon">📰</span>
              <span class="suggestion-text">この広告、あやしい？</span>
              <span class="suggestion-sub">写真を選ぶとすぐ判定します</span>
            </button>
            <button class="suggestion-card" data-mode="ad_check" data-photo="1"
              data-prompt="この画面が出てきました。どうすればいいですか？">
              <span class="suggestion-icon">📱</span>
              <span class="suggestion-text">この画面、なに？</span>
              <span class="suggestion-sub">急に出てきた警告や通知に</span>
            </button>
            <button class="suggestion-card" data-mode="ad_check" data-photo="1"
              data-prompt="このメール（またはメッセージ）は本物ですか？">
              <span class="suggestion-icon">✉️</span>
              <span class="suggestion-text">このメール、本物？</span>
              <span class="suggestion-sub">宅配・銀行・役所を名乗るものに</span>
            </button>
            <button class="suggestion-card" data-mode="chat"
              data-prompt="知らない番号から電話がかかってきました。出ても大丈夫ですか？">
              <span class="suggestion-icon">📞</span>
              <span class="suggestion-text">知らない電話が来た</span>
              <span class="suggestion-sub">出る前に相談</span>
            </button>
          </div>
        </section>
      </main>

      <!-- 入力エリア -->
      <footer class="composer">
        <div class="composer-inner">
          <!-- 会話が始まったあとも使えるコンパクトな提案チップ -->
          <div class="chips" id="chips">
            <button class="chip" data-mode="ad_check" data-photo="1"
              data-prompt="この広告はあやしくないですか？押しても大丈夫ですか？">📰 この広告あやしい？</button>
            <button class="chip" data-mode="ad_check" data-photo="1"
              data-prompt="この画面が出てきました。どうすればいいですか？">📱 この画面なに？</button>
            <button class="chip" data-mode="ad_check" data-photo="1"
              data-prompt="このメール（またはメッセージ）は本物ですか？">✉️ このメール本物？</button>
            <button class="chip" data-mode="chat"
              data-prompt="知らない番号から電話がかかってきました。出ても大丈夫ですか？">📞 知らない電話が来た</button>
          </div>

          <div id="composer-box" class="composer-box">
            <div id="image-preview-bar" class="image-preview" hidden>
              <img id="preview-img" src="" alt="添付画像">
              <button id="clear-image-btn" class="clear-img-btn" aria-label="画像を外す">✕</button>
            </div>
            <div id="voice-status-bar" class="voice-status" hidden>
              <span class="pulse-dot"></span>
              <span id="voice-status-text">お話しください…</span>
              <button id="stop-voice-btn" class="mini-btn">完了</button>
            </div>
            <textarea id="user-input" placeholder="Gemini に質問する" rows="1"></textarea>
            <div class="composer-actions">
              <label for="image-upload" class="tool-btn" title="写真・スクリーンショットを添付">
                📷<span class="tool-label">写真</span>
                <input type="file" id="image-upload" accept="image/*" hidden>
              </label>
              <button id="mic-btn" class="tool-btn" title="声で話す">
                🎤<span class="tool-label">声で話す</span>
              </button>
              <span class="spacer"></span>
              <button id="send-btn" class="send-btn" title="送信" aria-label="送信">➤</button>
            </div>
          </div>
          <p class="composer-note">
            Gemini の回答は間違うことがあります。お金・暗証番号・カードの話は、必ず洸晟に電話で確認してください。
          </p>
        </div>
      </footer>
    </div>
  </div>

  <!-- 設定モーダル（洸晟用） -->
  <div id="settings-modal" class="modal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h3>見守り・接続設定</h3>
        <button id="close-settings-btn" class="close-btn" aria-label="閉じる">✕</button>
      </div>
      <div class="modal-body">
        <label for="api-endpoint">Google Apps Script WebアプリURL</label>
        <input type="url" id="api-endpoint" placeholder="https://script.google.com/macros/s/.../exec">

        <label for="api-secret">共有合言葉 (SHARED_SECRET)</label>
        <input type="password" id="api-secret" placeholder="Code.gsで設定した英数字">

        <label for="kosei-tel">洸晟の電話番号（📞ボタン用）</label>
        <input type="tel" id="kosei-tel" placeholder="例: 09012345678">

        <p class="modal-hint">設定はこの端末のブラウザ内にだけ保存されます。電話番号はGAS側の KOSEI_TEL からも自動で受け取ります。</p>
        <button id="save-settings-btn" class="primary-btn">保存</button>
        <button id="clear-chats-btn" class="text-btn">この端末のチャット履歴をすべて消す</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
